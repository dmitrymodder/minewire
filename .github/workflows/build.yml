name: Build Binaries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build for Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build binary
        run: |
          GOOS=linux GOARCH=${{ matrix.arch }} go build -o minewire-server-${{ matrix.arch }} -ldflags="-s -w" ./src/

      - name: Create checksums
        run: |
          mkdir -p artifacts
          cp minewire-server-amd64 artifacts/minewire-server-linux-amd64 2>/dev/null || true
          cp minewire-server-arm64 artifacts/minewire-server-linux-arm64 2>/dev/null || true
          cd artifacts
          sha256sum * > checksums.txt
          echo "=== Files ready ==="
          ls -la
          cat checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: minewire-binaries
          path: artifacts/
          retention-days: 30