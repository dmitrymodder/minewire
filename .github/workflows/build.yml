name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build binaries
        run: |
          mkdir -p artifacts

          GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" \
            -o artifacts/minewire-server-linux-amd64 \
            ./src

          GOOS=linux GOARCH=arm64 \
            go build -ldflags="-s -w" \
            -o artifacts/minewire-server-linux-arm64 \
            ./src

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum minewire-server-linux-amd64 \
                    minewire-server-linux-arm64 \
            > checksums.txt

          echo "Artifacts:"
          ls -lh
          echo
          cat checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minewire
          path: artifacts/*
