name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build binary
        run: |
          GOOS=linux GOARCH=${{ matrix.arch }} go build -o minewire-server-${{ matrix.arch }} -ldflags="-s -w" ./src/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: minewire-server-${{ matrix.arch }}
          path: minewire-server-${{ matrix.arch }}

  release:
    name: Create Release Assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Package binaries and create checksums
        run: |
          mkdir -p release
          cp minewire-server-amd64/minewire-server-amd64 release/minewire-server-linux-amd64
          cp minewire-server-arm64/minewire-server-arm64 release/minewire-server-linux-arm64
          
          cd release
          sha256sum * > checksums.txt
          
          echo "Generated files:"
          ls -la
          cat checksums.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/minewire-server-linux-amd64
            release/minewire-server-linux-arm64
            release/checksums.txt
          draft: true
          prerelease: false